[workspace]
resolver = "2"
members = [
    "ani-dl",
    "ani-dl-cli",
    "ani-dl-core",
]

[workspace.package]
version = "1.0.1"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
futures = "0.3.32"
indicatif = "0.18.6"
inquire = "0.9.4"
kodik-api = "0.4.0"
kodik-parser = "3.0.1"
reqwest = "0.13.4"
serde = "1.0.228"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
async-trait = "0.1.91"
strum = { version = "0.28.0", features = ["derive"] }
console = "0.16.4"
